name: publish

# Publishing a GitHub release uploads that version to PyPI as
# idtrackerai-CYSM, so `pip install idtrackerai-CYSM` gets it.
#
# Uses PyPI trusted publishing: no API token is stored in this repository.
# One-time setup on pypi.org (Account settings -> Publishing -> Add a new
# pending publisher): project idtrackerai-CYSM, owner mbel-tech, repository
# idtrackerai-CYSM, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      # A release tagged v6.0.15a0.post2 must publish 6.0.15a0.post2, not
      # whatever pyproject.toml happens to say; PyPI never lets a version be
      # uploaded twice, so a mismatch is caught here rather than there.
      - name: Tag matches version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
